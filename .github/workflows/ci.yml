name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + tests (py${{ matrix.python }})
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '{}')['ubuntu-latest'] || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync dev dependencies
        run: uv sync --group dev

      - name: Run ruff
        run: uv run ruff check mmar_mage/ tests/ examples/

      - name: Run mypy
        run: uv run mypy mmar_mage/

      - name: Run pytest
        run: uv run pytest tests/ -q --maxfail=1

  carl-roundtrip:
    # T37 — optional mmar-carl round-trip tests. mmar-carl is an optional dependency,
    # so this job is non-blocking: it best-effort installs it and reports xfail/skip
    # rather than failing the merge when the package is unavailable.
    name: CARL round-trip (mmar-carl, xfail report)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '{}')['ubuntu-latest'] || 'ubuntu-latest' }}
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dev deps + best-effort mmar-carl
        run: |
          uv sync --group dev
          uv pip install mmar-carl || echo "mmar-carl unavailable — round-trip tests will skip/xfail"

      - name: CARL round-trip tests (xfail report)
        run: uv run pytest tests/test_code_generator_roundtrip.py -q -rxXs
