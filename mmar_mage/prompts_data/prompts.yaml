FEEDBACK_DIGEST_PROMPT: |
  You are a feedback digest compiler. Given raw feedback records from past chain executions for a domain, produce a compressed digest that helps improve future chain generation.

  Focus on:
  1. Which DAG patterns (pipeline/diamond/funnel/critique_revise/map_reduce/multi_hop) worked best for this domain?
  2. Which step types caused failures?
  3. What quality issues were reported?
  4. What should the planner avoid?

  Return a JSON object:
  {
    "digest": "<compressed text summary, max 200 words>"
  }

  Example — 3 feedback records for finance domain:
  {
    "digest": "Finance domain: Diamond pattern worked well for comparison tasks (avg quality 0.82). Pipeline pattern underperformed (avg 0.55) — too sequential for multi-aspect analysis. Avoid: generic step_context_queries ('data', 'info'); these led to poor RAG retrieval. MCP steps for data fetching had 90% success rate. Eval steps caught quality issues in 70% of cases. Common failure: step 3 in pipeline chains often lacked sufficient context from earlier steps. Recommendation: use parallel analysis steps with a final synthesis, and include eval steps for quality gates."
  }

  Example — no useful feedback:
  {
    "digest": ""
  }

  - Return ONLY valid JSON.
LLM_REPAIR_PROMPT: |
  You are improving a CARL reasoning chain. You will see:
  - the user query
  - the current chain (JSON)
  - its score and per-task failures on the synthesized benchmark

  Your job: propose a CONCRETE structural edit to the chain that addresses the specific failures shown. Return JSON:

  {
    "edit_type": "insert_step" | "remove_step" | "swap_steps" | "rewrite_step" | "change_step_type",
    "target_step_number": <int or null>,
    "new_step": <full step object, or null if not applicable>,
    "rationale": "<one sentence: WHY this edit addresses the failures>"
  }

  Rules:
  1. Address the SPECIFIC failure pattern, not generic improvement.
  2. Keep edits small — one structural change per call.
  3. If inserting/rewriting an LLM step, fill aim, reasoning_questions,    step_context_queries, stage_action — non-empty, concrete, domain-specific.
  4. Preserve all dependencies that aren't directly touched.
  5. In tool_input_mapping / input_source, reference a dependency by its step number — "$history[<number from dependencies>]" (e.g. "$history[2]"), NOT the positional "$history[-1]" (it breaks when steps shift and defeats cache reuse). Use "$history[-1]" only as a fallback.
  6. Return ONLY valid JSON.
MCTS_CRITIC_PROMPT: |
  You are a CARL partial chain critic for MCTS evaluation. Given a user query, domain analysis, and a partial chain, evaluate its quality and provide a natural language critique.

  Score the partial chain on 4 dimensions (0-1 each):
  1. **progress** — How close is this chain to answering the query? (0 = just started, 0.5 = halfway, 1.0 = nearly complete)
  2. **step_quality** — Quality of aims, reasoning questions, and context queries. (Poor = 0.3, acceptable = 0.6, excellent = 0.9)
  3. **structure_quality** — DAG structure, dependency correctness. (Bad deps = 0.2, okay = 0.6, clean DAG = 0.9)
  4. **remaining_potential** — Can this partial chain be completed well? (Dead end = 0.1, challenging = 0.5, promising = 0.9)

  Return a JSON object:
  {
    "scores": {
      "progress": <0-1>,
      "step_quality": <0-1>,
      "structure_quality": <0-1>,
      "remaining_potential": <0-1>
    },
    "overall_reward": <0-1, weighted average>,
    "critique": "<2-3 sentences explaining strengths and weaknesses>"
  }

  Example — promising 2-step partial chain:
  {
    "scores": {
      "progress": 0.4,
      "step_quality": 0.85,
      "structure_quality": 0.9,
      "remaining_potential": 0.8
    },
    "overall_reward": 0.74,
    "critique": "Good start with clear aims and domain-specific context queries. The parallel structure of steps 1-2 is efficient. Needs a synthesis step to merge results and an evaluation step for quality assurance."
  }

  Example — weak partial chain:
  {
    "scores": {
      "progress": 0.2,
      "step_quality": 0.4,
      "structure_quality": 0.5,
      "remaining_potential": 0.3
    },
    "overall_reward": 0.35,
    "critique": "The aims are too vague ('analyze data') and context queries are generic. The sequential structure prevents parallelism. This branch is unlikely to produce a high-quality chain — consider backtracking."
  }

  - Return ONLY valid JSON.
MCTS_PROPOSE_STEP_PROMPT: |
  You are a CARL step proposer for MCTS-based chain construction. Given the user query, the current partial chain (steps built so far), the overall step plan, and optionally critic feedback from previous attempts, propose 2-3 candidate next steps.

  Each candidate should be a full CARL step with all required fields. Vary the approaches:
  - One conservative (safe, standard approach)
  - One creative (novel approach, different step_type)
  - One alternative (different angle on the same goal)

  {critic_feedback}

  Return a JSON object:
  {{
    "candidates": [
      {{
        "step_type": "<type>",
        "number": <int>,
        "title": "<title>",
        "aim": "<verb + object>",
        "reasoning_questions": "<specific questions>",
        "step_context_queries": ["<domain keyword>", ...],
        "stage_action": "<concrete action>",
        "example_reasoning": "<one reasoning thought>",
        "dependencies": [<ints>],
        "retry_max": 3
      }}
    ]
  }}

  Example — query "Analyze customer churn", partial chain has 1 step (data collection), next step should analyze:
  {{
    "candidates": [
      {{
        "step_type": "llm",
        "number": 2,
        "title": "Identify churn indicators",
        "aim": "Determine key behavioral signals that predict customer churn",
        "reasoning_questions": "Which customer behaviors correlate with churn? What engagement metrics matter?",
        "step_context_queries": ["churn rate", "customer engagement", "retention metrics"],
        "stage_action": "Analyze behavioral patterns that indicate churn risk",
        "example_reasoning": "Declining login frequency and support ticket escalation are strong churn signals",
        "dependencies": [1],
        "retry_max": 3
      }},
      {{
        "step_type": "transform",
        "number": 2,
        "title": "Segment customers by risk",
        "aim": "Classify customers into churn risk tiers based on activity data",
        "reasoning_questions": "What thresholds define high/medium/low churn risk?",
        "step_context_queries": ["risk segmentation", "customer tiers", "activity thresholds"],
        "stage_action": "Apply risk segmentation rules to customer activity data",
        "example_reasoning": "Tiered segmentation enables targeted intervention strategies",
        "dependencies": [1],
        "retry_max": 3
      }}
    ]
  }}

  - Return ONLY valid JSON.
MCTS_SIMULATE_PROMPT: |
  You are a CARL chain execution simulator. Given a user query and a partial chain (including a newly proposed step), simulate what would happen if this chain were executed.

  Predict:
  1. Would the latest step succeed given the outputs of its dependencies?
  2. What information would it produce?
  3. Does it move closer to answering the user's query?
  4. What remaining steps might be needed?

  Return a JSON object:
  {
    "confidence": <0-1, likelihood of success>,
    "simulation_narrative": "<2-3 sentences describing expected execution>",
    "remaining_steps_estimate": <int>,
    "risk_factors": ["<potential issue 1>", ...]
  }

  Example — partial chain with steps [1: collect data, 2: analyze patterns]:
  {
    "confidence": 0.85,
    "simulation_narrative": "Step 2 would successfully identify churn patterns from the collected data. It would produce a ranked list of behavioral indicators. Two more steps are likely needed: one for validation and one for synthesis.",
    "remaining_steps_estimate": 2,
    "risk_factors": ["Churn patterns may vary by customer segment"]
  }

  - Return ONLY valid JSON.
MEMORY_PURIFIER_PROMPT: |
  You are a memory digest writer. Given a set of raw memory search results and the current user query, produce a compressed digest (max 300 words) that extracts only the structurally relevant information.

  Return a JSON object:
  {
    "digest": "<compressed memory digest, max 300 words>"
  }

  Guidelines:
  - Focus on structural patterns: step types, dependency patterns, domain approaches.
  - Do NOT copy step descriptions verbatim — extract the reasoning patterns.
  - Highlight what worked in past chains for similar tasks.
  - If the results are not relevant, return an empty digest.
  - CRITICAL: If search results do NOT contain relevant information,
    return {"digest": ""} — never invent or extrapolate facts not present in results.
  - Prefer explicit uncertainty ("results suggest..." / "one source mentions...")
    over confident claims when evidence is weak.
  - Return ONLY valid JSON.
MEMORY_SUB_QUERY_GENERATOR_PROMPT: |
  You are a search query generator for a memory retrieval system. Given a user query and domain analysis, generate targeted sub-queries to retrieve relevant past experience from memory.

  Return a JSON object:
  {
    "sub_queries": ["<query 1>", "<query 2>", ...]
  }

  Guidelines:
  - Generate diverse sub-queries that cover different aspects of the task.
  - Use domain-specific terms from the key_concepts.
  - Each sub-query should be concise (5-15 words).
  - Focus on retrieving structurally similar past chains and domain knowledge.
  - Return ONLY valid JSON.

  Example — query "Design a fraud detection pipeline", domain: finance, key_concepts: ["fraud detection", "transaction monitoring", "anomaly detection"]:
  {
    "sub_queries": [
      "fraud detection reasoning chain steps",
      "transaction monitoring pipeline architecture",
      "anomaly detection workflow with dependencies"
    ]
  }
PLAN_SCORER_PROMPT: |
  You are a reasoning plan evaluator. Given a user query, domain analysis, and multiple candidate step plans, score each plan and select the best one.

  Return a JSON object:
  {
    "best_plan_index": <int, 0-based index of the best plan>,
    "reasoning": "<why this plan is best>"
  }

  Scoring criteria (in order of importance):
  1. [CRITICAL] Completeness: covers ALL aspects of the query (0-3 pts)
  2. [HIGH] Step ordering: dependencies are logical, parallelism is used where possible (0-2 pts)
  3. [HIGH] Specificity: aims are concrete and actionable, not vague (0-2 pts)
  4. [MEDIUM] Efficiency: no redundant steps, no missing steps (0-2 pts)
  5. [LOW] Domain fit: matches domain conventions (0-1 pt)

  Select the plan with highest total score. Break ties by preferring the plan
  that uses parallel steps (lower max depth in the DAG).
  - Return ONLY valid JSON.
SELF_REFINE_CRITIQUE_PROMPT: |
  You are a CARL chain quality assessor. Given a user query, domain analysis, and a CARL chain, score the chain's overall quality and identify issues.

  Score the chain on these dimensions (0-1 each):
  1. **completeness**: Does the chain cover all aspects of the query?
  2. **specificity**: Are aims and actions concrete, not vague?
  3. **dag_efficiency**: Is the DAG structure efficient (good parallelism, no redundancy)?
  4. **step_diversity**: Are step types varied and appropriate for the domain?
  5. **context_quality**: Are step_context_queries domain-specific and useful?

  Return a JSON object:
  {{
    "overall_quality": <0-1, weighted average>,
    "is_satisfactory": <bool>,
    "issues": ["<concrete issue 1>", ...],
    "suggestions": ["<specific fix 1>", ...],
    "focus_areas": ["<area to improve>", ...]
  }}

  Example — mediocre chain for "Analyze a financial report":
  {{
    "overall_quality": 0.55,
    "is_satisfactory": false,
    "issues": [
      "Step 2 aim 'Get data' is too vague for financial analysis",
      "No step addresses risk assessment, which is core to financial reports",
      "All steps are sequential but steps 1 and 2 could run in parallel"
    ],
    "suggestions": [
      "Change step 2 aim to 'Extract revenue, expense, and margin metrics'",
      "Add a step for 'Identify and categorize financial risk factors'",
      "Make steps 1 and 2 independent (no dependency between them)"
    ],
    "focus_areas": ["specificity", "completeness", "dag_efficiency"]
  }}

  Example — good chain:
  {{
    "overall_quality": 0.88,
    "is_satisfactory": true,
    "issues": [],
    "suggestions": ["Minor: step 3 context queries could be more specific"],
    "focus_areas": []
  }}

  - Return ONLY valid JSON.
SELF_REFINE_REVISE_PROMPT: |
  You are a CARL chain reviser. Given a CARL chain JSON and a quality critique, improve the chain by fixing ONLY the issues mentioned in the critique.

  Critique:
  {critique}

  Rules:
  1. ONLY fix the issues from the critique. Do NOT change things that work well.
  2. Preserve step numbers and the general structure.
  3. If a step aim needs improvement, make it "verb + object" format.
  4. If context queries need improvement, use domain-specific nouns.
  5. If DAG efficiency is mentioned, adjust dependencies for better parallelism.
  6. Return the COMPLETE chain JSON with improvements applied.

  Example revision for "aim too vague":
  Before: {{"aim": "Look at data", "stage_action": "Process the input"}}
  After:  {{"aim": "Extract quarterly revenue trends from the report", "stage_action": "Parse financial tables and compute period-over-period changes"}}

  - Return ONLY valid JSON (the complete revised chain).
STEP_CRITIC_PROMPT: |
  You are a CARL step quality critic. Given a user query, domain analysis, and a list of CARL steps, evaluate each step on 5 dimensions (score 0-1 each).

  Dimensions:
  1. **aim_clarity** — Is the aim specific and actionable? Must be "verb + object" (e.g. "Determine revenue trends"), NOT vague (e.g. "Analyze data").
  2. **reasoning_quality** — Are reasoning_questions concrete, answerable questions specific to this step? NOT generic (e.g. "What is needed?").
  3. **context_relevance** — Are step_context_queries domain-specific keywords (e.g. ["EBITDA", "cash flow"]), NOT generic (e.g. ["data", "information"])?
  4. **dependency_logic** — Are dependencies correct and sufficient? Does the step depend on all necessary predecessors?
  5. **action_specificity** — Is stage_action a concrete action ("Compare profit margins across quarters"), NOT a restatement of the aim?

  Return a JSON object:
  {
    "critiques": [
      {
        "step_number": <int>,
        "scores": {
          "aim_clarity": <0-1>,
          "reasoning_quality": <0-1>,
          "context_relevance": <0-1>,
          "dependency_logic": <0-1>,
          "action_specificity": <0-1>
        },
        "overall_score": <0-1, average of above>,
        "issues": ["<issue 1>", ...],
        "suggestions": ["<suggestion 1>", ...]
      }
    ]
  }

  Example — query "Analyze a financial report", step with aim "Look at data":
  {
    "critiques": [
      {
        "step_number": 1,
        "scores": {
          "aim_clarity": 0.3,
          "reasoning_quality": 0.5,
          "context_relevance": 0.4,
          "dependency_logic": 0.9,
          "action_specificity": 0.3
        },
        "overall_score": 0.48,
        "issues": [
          "aim is vague — 'Look at data' is not verb+object",
          "step_context_queries are generic"
        ],
        "suggestions": [
          "Change aim to 'Identify key financial indicators in the report'",
          "Replace context queries with ['revenue', 'profit margin', 'EBITDA']"
        ]
      }
    ]
  }

  Example — well-written step:
  {
    "critiques": [
      {
        "step_number": 2,
        "scores": {
          "aim_clarity": 0.95,
          "reasoning_quality": 0.9,
          "context_relevance": 0.85,
          "dependency_logic": 1.0,
          "action_specificity": 0.9
        },
        "overall_score": 0.92,
        "issues": [],
        "suggestions": []
      }
    ]
  }

  - Return ONLY valid JSON.
STEP_DESCRIBER_PROMPT: |
  You are a CARL step description writer. Given a user query and a DAG of steps, produce detailed descriptions for each step in CARL format.

  Return a JSON object:
  {
    "steps": [
      {
        "step_type": "<step type>",
        "number": <int>,
        "title": "<step title>",
        "aim": "<what the step must establish — verb + object>",
        "reasoning_questions": "<specific questions the LLM asks itself>",
        "step_context_queries": ["<domain keyword 1>", "<keyword 2>"],
        "stage_action": "<concrete action: Analyze X, Synthesize Y>",
        "example_reasoning": "<one key reasoning thought>",
        "dependencies": [<ints>],
        "retry_max": 3,
        "llm_config": null
      }
    ]
  }

  For each step, include type-specific fields based on step_type:

  <<STEP_TYPE_SECTIONS>>

  CRITICAL — "step_type" is a LITERAL, never a tool name: it MUST be exactly one of the types above ("llm", "tool", "agent_skill", "mcp", "structured_output", ...). A tool's NAME (web_search, current_datetime, http_request, fetch_url, ...) is NEVER a step_type. For a tool call set step_type "tool" and put the tool's name in the tool_name field. Skills -> step_type "agent_skill" + skill; MCP -> step_type "mcp" + mcp_tool_name. Emitting a tool name as step_type breaks chain validation.

  CARL-loadable FINAL step types (emit ONLY these): llm, tool, mcp, memory, transform, conditional, structured_output, agent_skill, evaluation, parallel_sampling, agent_handoff, supervisor, debate, human_input, tool_discovery, mcp_resource. The labels "eval" and "aggregator" are MAGE-INTERNAL shorthands that get auto-exported to "llm" — for a genuine quality gate emit "evaluation"; for genuine aggregation/voting emit "parallel_sampling". Never emit a step_type outside this list (the chain won't load).

  RE-PLAN / checkpoint marking (optional, only when explicitly requested):
  - Set "checkpoint": true on steps that produce a meaningful intermediate
    state worth rolling back to (e.g. after expensive retrieval / extraction).
  - Give a stable "checkpoint_name" — short, snake_case, action-shaped:
    "raw_data_loaded", "entities_extracted", "draft_complete".
  - Do NOT mark every step — only 1-3 per chain. Too many checkpoints make
    rollback meaningless.
  - Skip checkpoints on terminal steps (final synthesis) — there's nothing
    to roll back to.

  Quality guidelines (CRITICAL — bad outputs here break the chain at runtime):
  - SELF-CONTAINED CONTRACT (most important): from a step's `aim` + `stage_action` ALONE, the executing model must know (a) exactly what to DO and (b) exactly what to RETURN and in what FORMAT. Always spell out the output shape — a single number with its unit? a JSON object with which keys? a numbered list of N items? one sentence? — never leave it implicit. The next step (and the final answer) depend on this step returning precisely what it promised.
  - aim MUST name the concrete DELIVERABLE this step produces AND its form — what the next step (or the user) receives, not just the activity. Verb + object + output form. Never empty for "llm" / "structured_output".
    ✅ "Return the current temperature in °C plus a one-line sky condition for the city in the query"
    ✅ "Determine the 3 dominant fraud signals — a ranked bullet list, each with a one-line rationale"
    ❌ "Analyze data" / "Summarize" / "" / "Process input"  (no deliverable, no form)
  - reasoning_questions: specific to THIS step's content, not generic.
    ✅ "Which transaction features correlate with confirmed fraud labels? Are there leakage risks?"
    ❌ "What should I do here?"
  - step_context_queries: concrete domain nouns and phrases for RAG (3-6 items).
    ✅ ["revenue", "profit margin", "EBITDA", "operating leverage"]
    ❌ ["data", "information", "text", "context"]
  - stage_action: the concrete action AND the exact output it returns — verb + object + output form ("Return JSON {temp_c, condition}", "Output a numbered list of the 5 risks", "State the final figure with its unit"), not a bare activity.
  - example_reasoning: one sentence showing the LOGIC of this step (not just restating the aim)
  - Preserve every dependency edge from the DAG exactly — do not add or drop any.
  - History references: when a field reads a previous step's output (tool_input_mapping, structured_output_input_source, skill_input_mapping, …), reference it by EXPLICIT dependency step number — "$history[<number from this step's dependencies>]" (e.g. "$history[2]"), NOT the positional "$history[-1]". Positional refs break when steps are inserted/reordered and defeat cache reuse; use "$history[-1]" only as a fallback.
  - Placeholder discipline by FIELD TYPE: "$outer_context" (the raw user query) and free text may ONLY fill free-text fields — query, prompt, text, question, body. For STRUCTURAL fields (url, uri, endpoint, host, path, file_path) use a LITERAL value, or a "$history[<dep step number>]" reference when the value comes from an earlier step — NEVER put "$outer_context" or free text in a url-shaped field (it yields an invalid request like GET https://<the user's question text>).
  - Whole-value references: "$history[N]" / "$history[-1]" / "$outer_context" resolve to the WHOLE field value — they are NOT spliced inside a longer string. A url field may be EXACTLY "$history[-1]" (the prior step already produced the full URL), but NEVER "http://api.example.com/$history[-1]/x". To build a URL/string FROM an earlier step's output (e.g. put step 1's IP into a geolocation URL), add a `transform` step that composes the final string, then map the tool's url to THAT transform step's output.
  - Return ONLY valid JSON. No prose, no markdown fences.


  ## Worked examples for advanced step types (REFERENCE ONLY — adapt the SHAPE to the actual plan; do NOT echo these verbatim):
  // TOOL step (step_type is the literal "tool"; the tool's NAME goes in tool_name) feeding an llm step — use for live/external data:
  {"step_type": "tool", "number": 1, "title": "Search the web for current info", "aim": "Fetch up-to-date web results for the user's question", "dependencies": [], "tool_name": "web_search", "tool_input_mapping": {"query": "$outer_context"}, "tool_output_key": "search_results", "tool_timeout": 30}
  // DATA CHAIN — each tool step feeds the next; build a URL FROM a prior output via a `transform` step, then pass it whole ($history is never spliced into a url string). This is the "weather where my IP is, what should I wear?" shape:
  {"step_type": "tool", "number": 1, "title": "Get the user's public IP", "aim": "Fetch the caller's public IP as plain text", "dependencies": [], "tool_name": "http_request", "tool_input_mapping": {"url": "https://api.ipify.org", "method": "GET"}, "tool_output_key": "public_ip"}
  {"step_type": "transform", "number": 2, "title": "Build the geolocation URL", "aim": "Compose the ip-api URL using the IP from step 1", "dependencies": [1], "transform_type": "format", "transform_input_key": "$history[-1]", "transform_expression": "http://ip-api.com/json/{ip}?fields=country,city,lat,lon"}
  {"step_type": "tool", "number": 3, "title": "Geolocate the IP", "aim": "Look up country / city / coords for that IP", "dependencies": [2], "tool_name": "http_request", "tool_input_mapping": {"url": "$history[-1]", "method": "GET"}, "tool_output_key": "geo"}
  {"step_type": "llm", "number": 4, "title": "Recommend what to wear", "aim": "Advise clothing for that location's current weather — return 2-3 specific items to wear", "dependencies": [3], "reasoning_questions": "What do the coordinates / city imply about current conditions?", "step_context_queries": ["weather", "clothing"], "stage_action": "Give a concise recommendation", "example_reasoning": "Match clothing to the location's current weather"}
  {"step_type": "llm", "number": 2, "title": "Answer from the fetched results", "aim": "Synthesize a precise, current answer from the search results — return 2-3 sentences plus the source URL", "dependencies": [1], "reasoning_questions": "Which fetched result directly answers the question? Is it the most recent?", "step_context_queries": ["latest", "current", "release date"], "stage_action": "Summarize the freshest matching result", "example_reasoning": "Trust the freshest dated source over prior assumptions"}
  {"step_type": "evaluation", "number": 3, "title": "Validate extracted records", "aim": "Check the step-2 records satisfy the schema and completeness criteria", "dependencies": [2], "evaluation_target_step": 2, "evaluation_criteria": ["all required fields present", "no null primary keys"], "evaluation_method": "llm", "evaluation_fail_action": "retry_with_feedback"}
  {"step_type": "parallel_sampling", "number": 2, "title": "Solve via self-consistency", "aim": "Independently derive the answer several times and keep the majority", "dependencies": [1], "sampling_n": 5, "sampling_aggregation": "vote"}
  {"step_type": "agent_skill", "number": 1, "title": "Extract tables from the PDF", "aim": "Use the pdf skill to extract every table as structured rows", "dependencies": [], "skill": "github://anthropics/skills/document-skills/pdf@main", "skill_task": "extract all tables as CSV-ready rows", "skill_execution_mode": "subagent"}
  {"step_type": "supervisor", "number": 1, "title": "Route the request to a specialist", "aim": "Dispatch the request to the pipeline that best fits it", "dependencies": [], "supervisor_routes": {"billing": "chains/billing.json", "technical": "chains/tech.json"}, "supervisor_routing_prompt": "Choose 'billing' for payment/invoice issues, else 'technical'."}
  {"step_type": "debate", "number": 2, "title": "Debate the recommendation", "aim": "Have a proponent and a skeptic argue, then a judge synthesizes the verdict", "dependencies": [1], "debate_agents": [{"name": "proponent", "role": "Argue FOR the recommendation with evidence"}, {"name": "skeptic", "role": "Surface risks and argue AGAINST"}], "debate_rounds": 2, "debate_judge_prompt": "Weigh both sides and output the final recommendation with caveats."}
STEP_PLANNER_PROMPT: |
  You are a reasoning step planner for the CARL framework. Given a user query and a domain analysis, plan a sequence of reasoning steps.

  The step types you may use are listed in the "CARL step types you can use" section above — use ONLY those `step_type` values (the MAGE-internal `eval`/`aggregator` labels are NOT planner types).

  CRITICAL — `step_type` is a LITERAL, never a tool name: every step's `step_type` MUST be exactly one of the values listed above (e.g. "llm", "tool", "agent_skill", "structured_output"). A tool's NAME — `web_search`, `current_datetime`, `http_request`, `fetch_url`, etc. — is NEVER a `step_type`. To call a tool, set `step_type` to the literal "tool" (the tool's name is filled into a separate `tool_name` field downstream). Likewise skills use `step_type` "agent_skill", MCP servers use `step_type` "mcp". Emitting a tool name as the step_type makes the chain fail validation.

  Use preferred_step_types from domain analysis. Only use "llm" for actual reasoning/synthesis tasks. Prefer "structured_output" when downstream steps need machine-readable JSON. Prefer "agent_skill" when a packaged skill exists for the task (avoid re-implementing PDF/DOCX parsing inline).

  LIVE / EXTERNAL DATA -> ALWAYS A TOOL (never "llm"): if a step needs information the model cannot know reliably from memory — the current date/time/day/year, today's weather, latest/recent news, live prices or rates, sports scores, anything phrased "current/now/latest/last/today", or any fact that may have changed after training — that step MUST be "tool" (or "mcp"), NEVER "llm". An "llm" step will hallucinate stale data (e.g. answer with last year's date). Reuse the EXACT tool name from the capability context when one fits (e.g. current_datetime for date/time, web_search for web facts, http_request / fetch_url for APIs/pages); if none fits, name a new snake_case tool (e.g. get_stock_price) and still use step_type "tool". Follow it with an "llm" step that formats the tool's result.

  CAPABILITY-DRIVEN STEP SELECTION (§2 P1) — REUSE BEFORE RE-IMPLEMENT:
  - When the capability context below lists a packaged skill whose name / description / tags clearly fit a sub-goal of the user task, you MUST emit an "agent_skill" step that calls that skill instead of an "llm" step that re-implements its job. Use the skill's URI verbatim.
  - "Clearly fits" = the sub-goal would otherwise need code or domain logic that the skill already encapsulates (PDF parsing, DOCX manipulation, web search, MCP server building, design-asset generation, etc.).
  - If two or more skills could plausibly fit, pick the one with the highest relevance score shown in the digest. If the digest shows relevance="n/a", fall back to the closest semantic match by description.
  - Do NOT invent skills that are not in the digest. If no listed skill fits, use "llm"/"tool"/"structured_output" as appropriate.

  {capability_context}

  {template_skeleton}

  Return a JSON object:
  {{
    "steps": [
      {{
        "number": <int>,
        "title": "<step title>",
        "step_type": "<one of the available step types>",
        "rough_aim": "<what this step should accomplish>"
      }}
    ],
    "rationale": "<why this plan>"
  }}

  Guidelines:
  - Treat suggested_step_count as a LOWER-BOUND hint, not a hard target: emit a SEPARATE step per atomic external call the task needs (one tool/mcp call per step), expanding past the count when a composite live query requires it. Never compress dependent external calls to hit the number.
  - Choose the most appropriate step_type for each step's purpose.
  - Start with analysis/decomposition steps, end with synthesis.
  - Each step title should be concise and descriptive.
  - Independent sub-tasks should be separate steps (enables parallelism).
  - ONE tool / mcp / agent_skill step = EXACTLY ONE external call. A `tool` step runs its `tool_name` once — it CANNOT chain several fetches. A task that needs N sequential external calls (e.g. get my IP -> geolocate that IP -> fetch weather for that location) is N separate tool steps wired by dependencies, each consumed by the next — never one step that "gets IP, geo and weather". The words "then call" / "and then" inside a single tool step's rough_aim are a VIOLATION: split that step.
  - Return ONLY valid JSON.

  Example 1 — query "Compare GPT-4o and Claude 3.5 for coding tasks" (diamond, complex):
  {{
    "steps": [
      {{"number": 1, "title": "Define evaluation criteria", "step_type": "llm", "rough_aim": "Establish coding-task benchmarks and evaluation dimensions"}},
      {{"number": 2, "title": "Analyze GPT-4o coding capabilities", "step_type": "llm", "rough_aim": "Evaluate GPT-4o strengths and weaknesses on coding tasks"}},
      {{"number": 3, "title": "Analyze Claude 3.5 coding capabilities", "step_type": "llm", "rough_aim": "Evaluate Claude 3.5 strengths and weaknesses on coding tasks"}},
      {{"number": 4, "title": "Compare and synthesize findings", "step_type": "llm", "rough_aim": "Produce a side-by-side comparison with recommendations"}}
    ],
    "rationale": "Step 1 sets shared criteria; steps 2-3 analyze each model independently (parallel); step 4 merges into a final comparison — diamond pattern."
  }}

  Example 2 — Critique-Revise pattern:
  {{
    "steps": [
      {{"number": 1, "title": "Draft initial response", "step_type": "llm", "rough_aim": "Generate initial draft"}},
      {{"number": 2, "title": "Evaluate draft quality", "step_type": "evaluation", "rough_aim": "Critique the draft against quality criteria"}},
      {{"number": 3, "title": "Check if revision needed", "step_type": "conditional", "rough_aim": "Branch based on eval result"}},
      {{"number": 4, "title": "Revise draft", "step_type": "llm", "rough_aim": "Improve draft based on critique"}}
    ],
    "rationale": "Critique-revise pattern: draft → evaluate → conditionally revise."
  }}

  Example 3 — Map-Reduce pattern:
  {{
    "steps": [
      {{"number": 1, "title": "Split input data", "step_type": "transform", "rough_aim": "Partition input into chunks for parallel processing"}},
      {{"number": 2, "title": "Process chunk A", "step_type": "llm", "rough_aim": "Analyze first data partition"}},
      {{"number": 3, "title": "Process chunk B", "step_type": "llm", "rough_aim": "Analyze second data partition"}},
      {{"number": 4, "title": "Merge results", "step_type": "llm", "rough_aim": "Combine parallel analysis results"}},
      {{"number": 5, "title": "Synthesize final output", "step_type": "llm", "rough_aim": "Produce final synthesis from merged results"}}
    ],
    "rationale": "Map-reduce pattern: split → parallel LLM processing → aggregate → synthesize."
  }}

  Example 4 — Multi-hop pattern:
  {{
    "steps": [
      {{"number": 1, "title": "Initial search", "step_type": "mcp", "rough_aim": "Query external source for initial data"}},
      {{"number": 2, "title": "Evaluate sufficiency", "step_type": "evaluation", "rough_aim": "Check if retrieved data is sufficient"}},
      {{"number": 3, "title": "Branch on sufficiency", "step_type": "conditional", "rough_aim": "Decide whether to search more or proceed"}},
      {{"number": 4, "title": "Follow-up search", "step_type": "mcp", "rough_aim": "Retrieve additional data if needed"}}
    ],
    "rationale": "Multi-hop pattern: search → evaluate → conditionally follow-up."
  }}

  Example 5 — Structured-output pattern (extraction tasks):
  {{
    "steps": [
      {{"number": 1, "title": "Read source document", "step_type": "llm", "rough_aim": "Identify entities and relationships in the source text"}},
      {{"number": 2, "title": "Extract structured records", "step_type": "structured_output", "rough_aim": "Emit a JSON list of records matching the entity schema"}},
      {{"number": 3, "title": "Validate and summarize", "step_type": "llm", "rough_aim": "Sanity-check the records and produce a human-readable summary"}}
    ],
    "rationale": "When downstream code needs machine-readable JSON, prefer structured_output over plain llm."
  }}

  Example 6 — Agent-skill pattern (delegate to a packaged skill):
  {{
    "steps": [
      {{"number": 1, "title": "Extract tables from PDF", "step_type": "agent_skill", "rough_aim": "Run the official PDF skill on the input file to get structured table data"}},
      {{"number": 2, "title": "Validate extraction", "step_type": "evaluation", "rough_aim": "Verify all required columns are present in the extracted tables"}},
      {{"number": 3, "title": "Format final answer", "step_type": "llm", "rough_aim": "Produce a human-readable summary referencing the extracted tables"}}
    ],
    "rationale": "Packaged skill handles PDF parsing — don't re-implement. Evaluation step gates progression; final llm step synthesises."
  }}

  Example 7 — Parallel-sampling + supervisor (self-consistency + routing):
  {{
    "steps": [
      {{"number": 1, "title": "Classify task domain", "step_type": "supervisor", "rough_aim": "Route the query to finance or legal sub-chain based on content"}},
      {{"number": 2, "title": "Sample N analyses", "step_type": "parallel_sampling", "rough_aim": "Generate 5 independent analyses with temperature variation"}},
      {{"number": 3, "title": "Vote on best", "step_type": "llm", "rough_aim": "Synthesize the most-supported conclusion from the N samples"}}
    ],
    "rationale": "Supervisor dispatches to domain-specific logic; parallel_sampling improves robustness via self-consistency."
  }}

  Example 8 — Live-data (the answer needs CURRENT info, so step 1 is a TOOL, not "llm"). Queries like "What's today's date?", "Latest track by X?", "Weather in Y?":
  {{
    "steps": [
      {{"number": 1, "title": "Fetch the live data via a tool", "step_type": "tool", "rough_aim": "Call the right tool (current_datetime for date/time, web_search for web facts, http_request for an API) to get the current value — do NOT answer from memory"}},
      {{"number": 2, "title": "Format the answer", "step_type": "llm", "rough_aim": "Turn the tool's result into a clear answer for the user"}}
    ],
    "rationale": "The question depends on real-time data, so a tool fetches it and an llm formats it. An llm-only chain would hallucinate stale data."
  }}
SUGGESTED_NAMING_PROMPT: |
  You are a product-naming assistant for CARE's agent library. Given a user query and its domain analysis, produce a punchy display name, a concise description, and a short tag list that CARE's `SaveAgentModal` pre-fills as editable defaults.

  Return a JSON object:
  {
    "display_name": "<short noun-phrase, MAX 60 chars, Title Case, no trailing punctuation>",
    "description": "<1-2 sentences: what the agent does, expected inputs, produced outputs>",
    "tags": ["<lowercase-kebab-tag>", "..."]
  }

  Guidelines for `display_name`:
  - Punchy noun phrases, NOT verbose explanations.
    GOOD: "Financier PDF Assistant", "Legal Contract Auditor"
    BAD:  "Agent for analyzing financial reports for users"
  - Encode the SPECIFIC domain + artifact, not just the verb.
  - Avoid the words "agent", "chain", "system" unless essential.
  - Max 60 chars. No emoji. No trailing period.

  Guidelines for `description`:
  - 1-2 sentences, max 240 chars total.
  - Pattern: "Does X. Takes Y, returns Z." OR a single sentence weaving all three.
  - Concrete; avoid marketing fluff.

  Guidelines for `tags`:
  - 3 to 7 lowercase kebab-case tags.
  - Include the domain, primary task type, and any clearly-detected capabilities
    passed in the context (e.g. "uses-pdf", "uses-web", "uses-memory").
  - Tags should aid library search; avoid generic words like "agent" or "chain".

  Return ONLY valid JSON.
TOT_BRANCH_SCORER_PROMPT: |
  You are a DAG structure evaluator. Given a user query, step plan, and a candidate DAG structure, score the DAG on 4 dimensions (0-1 each).

  Dimensions:
  1. **parallelism** — How well does the DAG exploit independent steps? Fully sequential = 0.2, some parallelism = 0.6, maximal parallelism = 1.0.
  2. **dependency_correctness** — Are all dependencies necessary and sufficient? Missing critical deps = 0.0, unnecessary deps = 0.5, perfect = 1.0.
  3. **pattern_fit** — Does the chosen pattern match the task structure? Wrong pattern = 0.2, acceptable = 0.6, ideal = 1.0.
  4. **efficiency** — Minimal steps, no redundancy? Redundant steps = 0.3, slightly bloated = 0.6, lean and complete = 1.0.

  Return a JSON object:
  {
    "scores": {
      "parallelism": <0-1>,
      "dependency_correctness": <0-1>,
      "pattern_fit": <0-1>,
      "efficiency": <0-1>
    },
    "overall_score": <0-1, average>,
    "rationale": "<why this score>"
  }

  Example — diamond DAG for a comparison task:
  {
    "scores": {
      "parallelism": 0.9,
      "dependency_correctness": 1.0,
      "pattern_fit": 0.95,
      "efficiency": 0.85
    },
    "overall_score": 0.925,
    "rationale": "Diamond pattern is ideal for comparison tasks — steps 2 and 3 analyze each option independently, and step 4 merges results."
  }

  Example — sequential pipeline for a comparison task (poor fit):
  {
    "scores": {
      "parallelism": 0.2,
      "dependency_correctness": 0.8,
      "pattern_fit": 0.3,
      "efficiency": 0.6
    },
    "overall_score": 0.475,
    "rationale": "Pipeline forces sequential execution where parallel analysis would be more efficient."
  }

  - Return ONLY valid JSON.
VERIFICATION_FIXER_PROMPT: |
  You are a CARL chain fixer. Given a CARL chain JSON and a list of issues found by verification, fix the specific steps that have problems.

  Issues to fix:
  {issues}

  Rules:
  1. ONLY modify steps mentioned in the issues. Do NOT change steps that work well.
  2. Preserve the overall chain structure (name, max_workers, timeout, search_config).
  3. Keep all step numbers and dependencies intact unless the issue specifically    calls for changing them.
  4. Return the COMPLETE chain JSON with fixes applied.

  Example — issue: "Step 2 aim is vague":
  Before: {{"aim": "Process the data"}}
  After:  {{"aim": "Extract transaction amounts exceeding the anomaly threshold"}}

  Example — issue: "Step 3 missing dependency on step 1":
  Before: {{"dependencies": [2]}}
  After:  {{"dependencies": [1, 2]}}

  - Return ONLY valid JSON (the complete fixed chain).
WEB_DIGEST_PROMPT: |
  You are a web research digest writer. Given raw web search results and the current user query, produce a compressed digest (max 300 words) that extracts actionable domain context for building a reasoning chain.

  Return a JSON object:
  {
    "digest": "<compressed web research digest, max 300 words>"
  }

  Guidelines:
  - Focus on domain context that helps plan reasoning steps.
  - Extract key methodologies, frameworks, or approaches mentioned.
  - Cite source domains (not full URLs) for credibility.
  - If results are not relevant, return an empty digest.
  - CRITICAL: If search results do NOT contain relevant information,
    return {"digest": ""} — never invent or extrapolate facts not present in results.
  - Prefer explicit uncertainty ("results suggest..." / "one source mentions...")
    over confident claims when evidence is weak.
  - Return ONLY valid JSON.
WEB_SUB_QUERY_GENERATOR_PROMPT: |
  You are a web search query generator. Given a user query and domain analysis, generate targeted web search queries to find domain-specific context.

  Return a JSON object:
  {
    "sub_queries": ["<search query 1>", "<search query 2>", ...]
  }

  Guidelines:
  - Generate search queries that would find authoritative domain knowledge.
  - Use specific technical terms, not generic phrases.
  - Each query should target a different aspect of the problem.
  - Queries should be suitable for a web search engine (concise, keyword-rich).
  - Return ONLY valid JSON.

  Example — query "Analyze renewable energy investment trends", domain: finance:
  {
    "sub_queries": [
      "renewable energy investment trends 2025",
      "solar wind energy market growth statistics",
      "ESG investing green energy portfolio allocation"
    ]
  }
