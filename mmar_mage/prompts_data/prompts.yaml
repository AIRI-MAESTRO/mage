BENCHMARK_SYNTHESIZER_PROMPT: |
  You are a benchmark designer. Given a user query, your job is to produce a small but DIVERSE set of CONCRETE test cases that any reasonable solution chain must handle correctly.

  Return a JSON object with this shape:
  {
    "rubric_summary": "<1-2 sentences describing what every correct answer must establish>",
    "tasks": [
      {
        "task_id": "synth_001",
        "input": "<concrete test input — a complete, self-contained instance>",
        "expected_output": "<reference answer> or null for open-ended tasks",
        "rubric": ["must contain X", "must NOT confuse Y with Z", "..."],
        "difficulty": "easy" | "medium" | "hard",
        "metadata": {}
      }
    ]
  }

  Rules:
  1. Generate exactly the number of tasks the user asks for.
  2. Tasks must be CONCRETE INSTANCES — not templates or descriptions.
     ✅ "Verify whether the director of Inception also directed Titanic."
     ❌ "Verify a fact about a director" (template, not an instance)
  3. Cover difficulty tiers — at least one easy, one hard.
  4. Cover failure modes the chain might hit:
     - Edge cases (empty input, ambiguous wording, conflicting evidence)
     - Adversarial-but-fair (close-but-wrong distractors in rubric)
     - Multi-step / multi-hop where the naive single-shot answer is wrong
  5. Rubric items must be VERIFIABLE properties of the output, not vibes.
     ✅ "answer mentions both 'Christopher Nolan' and 'Inception'"
     ❌ "answer is well-written"
  6. expected_output is null only if the task is genuinely open-ended.
     For factual/extraction/classification tasks, ALWAYS include a reference.
  7. Return ONLY valid JSON.

  Example — query "Extract structured data from invoice PDFs":
  {
    "rubric_summary": "Output must be a JSON record with vendor, total, currency, line_items[].",
    "tasks": [
      {
        "task_id": "synth_001",
        "input": "Invoice from Acme Corp, dated 2024-03-15. Items: Widget A x2 @ $50, Widget B x1 @ $80. Total: $180.00 USD.",
        "expected_output": "{\"vendor\": \"Acme Corp\", \"total\": 180.0, \"currency\": \"USD\", \"line_items\": [{\"name\": \"Widget A\", \"qty\": 2, \"unit_price\": 50}, {\"name\": \"Widget B\", \"qty\": 1, \"unit_price\": 80}]}",
        "rubric": ["vendor='Acme Corp'", "total=180.0", "currency='USD'", "exactly 2 line_items"],
        "difficulty": "easy",
        "metadata": {}
      },
      {
        "task_id": "synth_002",
        "input": "Rechnung von Müller GmbH, 2024-04-02. Pos. 1: Schraube x100 zu 0,15 EUR/Stk. MwSt 19%. Gesamt: 17,85 EUR.",
        "expected_output": "{\"vendor\": \"Müller GmbH\", \"total\": 17.85, \"currency\": \"EUR\", \"line_items\": [{\"name\": \"Schraube\", \"qty\": 100, \"unit_price\": 0.15}]}",
        "rubric": ["vendor='Müller GmbH'", "total=17.85", "currency='EUR'", "non-English locale handled (comma decimal)"],
        "difficulty": "hard",
        "metadata": {"language": "de"}
      }
    ]
  }
CHAIN_EDIT_PROMPT: |
  You edit an existing CARL reasoning chain. You will see:
  - an instruction: what the user wants changed, in natural language
  - the current chain (JSON), with steps numbered 1..N

  Your job: produce the MINIMAL edit plan that satisfies the instruction and
  changes nothing else. Return JSON:

  {
    "summary": "<one plain-language sentence describing the change>",
    "edits": [
      {
        "op": "remove_step" | "insert_step" | "rewrite_step" | "change_step_type" | "swap_steps" | "edit_field" | "set_dependencies" | "set_chain_field",
        "target_step_number": <int, or null>,
        "new_step": <full step object, or null>,
        "fields": <object of key->value patches, or null>,
        "value": <any, or null>,
        "rationale": "<one sentence: why this edit satisfies the instruction>"
      }
    ]
  }

  Operation reference:
  - edit_field: patch specific keys on the step at target_step_number. Put the
    keys in "fields", e.g. {"aim": "...", "stage_action": "..."}. Use this for
    small wording/intent tweaks — do NOT re-emit the whole step.
  - rewrite_step: replace the step at target_step_number with "new_step" (its
    "number" and "dependencies" are preserved automatically).
  - change_step_type: change the step at target_step_number to
    new_step.step_type (carry any type-specific fields in "new_step").
  - insert_step: add "new_step" after target_step_number (or at the end if
    target_step_number is null). Fill aim, reasoning_questions,
    step_context_queries, stage_action — concrete and domain-specific.
  - remove_step: delete the step at target_step_number; dependencies through it
    are rewired automatically.
  - swap_steps: swap the step at target_step_number with the one after it.
  - set_dependencies: set the step's dependency list; put the list in "value",
    e.g. "value": [1, 2].
  - set_chain_field: set a chain-level field; put it in "fields", limited to
    {"name", "max_workers", "timeout"}. target_step_number is null.

  Rules:
  1. Address ONLY what the instruction asks. Preserve every step, field, and
     dependency it does not mention.
  2. target_step_number refers to the numbering in the chain shown above.
     Prefer at most ONE structural edit (insert/remove/swap/rewrite/
     change_step_type) per request; combine as many field edits as you need.
  3. Never renumber steps yourself — that is handled after your edits apply.
  4. If the instruction is already satisfied or is not an edit, return
     {"summary": "No change needed.", "edits": []}.
  5. For fields that read another step's output (tool_input_mapping, input_source), reference the dependency by its step number — "$history[<number>]" (e.g. "$history[2]"), NOT the positional "$history[-1]" (it breaks when steps shift). Use "$history[-1]" only as a fallback.
  6. Return ONLY valid JSON.

  Example — "make step 2 cheaper and add a final validation step":
  {
    "summary": "Switched step 2 to a smaller model and appended a validation step.",
    "edits": [
      {"op": "edit_field", "target_step_number": 2,
       "fields": {"llm_config": {"model": "gpt-4o-mini"}},
       "rationale": "Smaller model lowers the cost of the extraction step."},
      {"op": "insert_step", "target_step_number": 3,
       "new_step": {"step_type": "llm", "title": "Validate summary",
         "aim": "Check the summary against the extracted facts for contradictions",
         "reasoning_questions": "Does every claim trace back to an extracted fact?",
         "step_context_queries": ["summary", "facts", "contradiction"],
         "stage_action": "Flag and correct unsupported claims",
         "dependencies": [3]},
       "rationale": "Adds the requested validation pass after synthesis."}
    ]
  }

  Example — "rename the chain to 'Invoice QA' and make step 1 a structured_output step":
  {
    "summary": "Renamed the chain and converted step 1 to structured_output.",
    "edits": [
      {"op": "set_chain_field", "target_step_number": null,
       "fields": {"name": "Invoice QA"},
       "rationale": "Applies the requested chain name."},
      {"op": "change_step_type", "target_step_number": 1,
       "new_step": {"step_type": "structured_output"},
       "rationale": "Step 1 now emits structured output as requested."}
    ]
  }
CHAIN_FLATTEN_EXECUTION_PROMPT: |-
  Follow this reasoning plan to answer the task. Work through the steps in order, then output a single, focused final answer.

  REASONING PLAN:
  {plan}

  TASK INPUT:
  {input}

  Now work through the plan step by step and give the final answer.
CHAIN_JUDGE_PROMPT: |
  You are a strict, objective grader. Score a chain's output against a reference answer and a rubric. Return JSON:

  {
    "score": <float 0.0-1.0>,
    "rubric_results": [{"item": "<rubric item>", "passed": true|false, "evidence": "<quote>"}],
    "notes": "<one-sentence justification>"
  }

  Rules:
  - score = fraction of rubric items passed (rounded to 2 decimals).
  - If expected_output is provided and the chain output contradicts it on key facts,   cap score at 0.3 even if rubric items technically pass.
  - Be literal. "Equivalent paraphrase" only counts if the rubric explicitly allows it.
  - Verbose, repetitive, or keyword-stuffed step descriptions are a NEGATIVE signal — score on substance, not on how many rubric words appear in the text.
  - Return ONLY valid JSON.
CHAIN_JUDGE_REAL_OUTPUT_PROMPT: |
  You are a strict, objective grader. The reasoning chain was executed on the test input and produced an ACTUAL response. Score that response against the reference answer and rubric. Return JSON:

  {
    "score": <float 0.0-1.0>,
    "rubric_results": [{"item": "<rubric item>", "passed": true|false, "evidence": "<quote from actual response>"}],
    "notes": "<one-sentence justification>"
  }

  Rules:
  - score = fraction of rubric items passed (rounded to 2 decimals).
  - "evidence" MUST be a literal quote from the actual response (or "not present" if missing).
  - If expected_output is provided and the actual response contradicts it on a   key fact, cap score at 0.3 even if rubric items technically pass.
  - Empty / refusal responses score 0.0.
  - Verbose, repetitive, or keyword-stuffed responses are a NEGATIVE signal — score on substance, not on how many rubric words appear.
  - Return ONLY valid JSON.
CHAIN_VERIFICATION_PROMPT: |
  You are a CARL chain verification expert. Given a user query, domain analysis, and a serialized CARL chain, generate verification questions to check the chain's quality and correctness.

  Generate up to {max_questions} questions per step. Each question should target one of:
  - **factual**: Does this step's aim/action make factual sense for the domain?
  - **logical**: Is the dependency ordering logically correct?
  - **completeness**: Does the chain cover all aspects of the query?
  - **consistency**: Are step descriptions consistent with each other?

  Return a JSON object:
  {{
    "questions": [
      {{
        "step_number": <int>,
        "question": "<verification question>",
        "aspect": "<factual | logical | completeness | consistency>"
      }}
    ]
  }}

  Example — query "Design a fraud detection pipeline", 3-step chain:
  {{
    "questions": [
      {{
        "step_number": 1,
        "question": "Does defining transaction anomaly patterns require domain knowledge of normal transaction behavior?",
        "aspect": "factual"
      }},
      {{
        "step_number": 2,
        "question": "Can rule-based filtering in step 2 proceed without the anomaly patterns from step 1?",
        "aspect": "logical"
      }},
      {{
        "step_number": 3,
        "question": "Does the chain address false-positive reduction, a critical aspect of fraud detection?",
        "aspect": "completeness"
      }}
    ]
  }}

  - Return ONLY valid JSON.
DAG_BUILDER_PROMPT: |
  You are a dependency graph builder for reasoning chains. Given a step plan, determine the dependency structure between steps.

  Return a JSON object:
  {
    "steps": [
      {
        "number": <int>,
        "title": "<step title>",
        "step_type": "<step type>",
        "dependencies": [<step numbers this step depends on>],
        "rough_aim": "<what this step should accomplish>"
      }
    ],
    "max_workers": <int, 1-4>,
    "pattern": "<one of the pattern names listed under 'DAG patterns' below>"
  }

  DAG patterns:
  <<DAG_PATTERNS>>

  Rules:
  1. First step(s) MUST have dependencies: [].
  2. A step can only depend on steps with LOWER numbers.
  3. NO cycles allowed.
  4. Steps that can run independently should have no mutual dependencies.
  5. Final synthesis step should depend on all analysis steps.
  6. max_workers = max number of steps in any single parallel batch.

  Example 1 — diamond pattern (A → B,C → D):
  {
    "steps": [
      {"number": 1, "title": "Define evaluation criteria", "step_type": "llm", "dependencies": [], "rough_aim": "Establish shared evaluation framework"},
      {"number": 2, "title": "Analyze option A", "step_type": "llm", "dependencies": [1], "rough_aim": "Evaluate first option against criteria"},
      {"number": 3, "title": "Analyze option B", "step_type": "llm", "dependencies": [1], "rough_aim": "Evaluate second option against criteria"},
      {"number": 4, "title": "Compare and synthesize", "step_type": "llm", "dependencies": [2, 3], "rough_aim": "Merge analyses into a recommendation"}
    ],
    "max_workers": 2,
    "pattern": "diamond"
  }

  Example 2 — critique_revise pattern:
  {
    "steps": [
      {"number": 1, "title": "Draft response", "step_type": "llm", "dependencies": [], "rough_aim": "Generate initial draft"},
      {"number": 2, "title": "Evaluate quality", "step_type": "evaluation", "dependencies": [1], "rough_aim": "Critique draft quality"},
      {"number": 3, "title": "Branch on quality", "step_type": "conditional", "dependencies": [2], "rough_aim": "Decide if revision needed"},
      {"number": 4, "title": "Revise draft", "step_type": "llm", "dependencies": [3], "rough_aim": "Improve draft based on critique"}
    ],
    "max_workers": 1,
    "pattern": "critique_revise_loop"
  }

  Example 3 — map_reduce pattern:
  {
    "steps": [
      {"number": 1, "title": "Split data", "step_type": "transform", "dependencies": [], "rough_aim": "Partition input"},
      {"number": 2, "title": "Process chunk A", "step_type": "llm", "dependencies": [1], "rough_aim": "Analyze partition A"},
      {"number": 3, "title": "Process chunk B", "step_type": "llm", "dependencies": [1], "rough_aim": "Analyze partition B"},
      {"number": 4, "title": "Merge results", "step_type": "llm", "dependencies": [2, 3], "rough_aim": "Combine analyses"},
      {"number": 5, "title": "Synthesize", "step_type": "llm", "dependencies": [4], "rough_aim": "Final synthesis"}
    ],
    "max_workers": 2,
    "pattern": "map_reduce"
  }

  - Return ONLY valid JSON.
DOMAIN_ANALYZER_PROMPT: |
  You are a domain analysis expert. Given a user query, analyze it and return a JSON object with the following fields:

  {
    "domain": "<knowledge domain, e.g. finance, medicine, engineering, general>",
    "task_type": "<analysis | generation | qa | classification | extraction | planning>",
    "complexity": "<simple | medium | complex>",
    "key_concepts": ["<domain-specific concept 1>", "<concept 2>", ...],
    "suggested_step_count": <int, 2-8>,
    "preferred_step_types": ["<CARL step type, optional — see the guidance below>", ...]
  }

  Guidelines:
  - "simple" tasks (2-3 steps): direct Q&A, single-aspect analysis
  - "medium" tasks (3-5 steps): multi-aspect analysis, comparison
  - "complex" tasks (5-8 steps): multi-domain analysis, planning with conditions
  - COUNT ATOMIC EXTERNAL CALLS: each live/external fact the task needs (current IP, geolocation, weather, a price, …) is ONE tool call = ONE step. A query that CHAINS them (e.g. "weather where my IP is" = get IP -> geolocate that IP -> fetch weather -> advise) is at least 4 steps and complexity "medium" or higher, NOT "simple". Never collapse a sequence of DEPENDENT external calls into one step or undercount them as a single "block".
  - key_concepts: extract domain-specific nouns and terms, NOT generic words
  - Return ONLY valid JSON.

  Example 1 — query "Analyze financial report and identify risks":
  {
    "domain": "finance",
    "task_type": "analysis",
    "complexity": "complex",
    "key_concepts": ["financial report", "risks", "revenue", "expenses", "cash flow", "EBITDA"],
    "suggested_step_count": 5,
    "preferred_step_types": ["mcp", "transform", "llm", "evaluation"]
  }

  Example 2 — query "Summarize this article":
  {
    "domain": "general",
    "task_type": "extraction",
    "complexity": "simple",
    "key_concepts": ["article", "summary", "main points"],
    "suggested_step_count": 2,
    "preferred_step_types": ["llm"]
  }

  Example 3 — query "Compare React and Vue for a startup project":
  {
    "domain": "engineering",
    "task_type": "analysis",
    "complexity": "medium",
    "key_concepts": ["React", "Vue", "frontend framework", "startup", "developer experience", "ecosystem"],
    "suggested_step_count": 4,
    "preferred_step_types": ["tool", "llm", "evaluation", "conditional"]
  }

  Example 4 — query "What's the weather in Moscow right now?" (needs LIVE data → lead with a tool):
  {
    "domain": "general",
    "task_type": "qa",
    "complexity": "simple",
    "key_concepts": ["weather", "Moscow", "current conditions", "temperature"],
    "suggested_step_count": 2,
    "preferred_step_types": ["tool", "llm"]
  }

  Example 5 — query "What's the weather where my IP is, and what should I wear?" (composite LIVE: 3 dependent external calls + advice):
  {
    "domain": "general",
    "task_type": "qa",
    "complexity": "medium",
    "key_concepts": ["IP address", "geolocation", "weather", "clothing recommendation"],
    "suggested_step_count": 4,
    "preferred_step_types": ["tool", "tool", "tool", "llm"]
  }

  Based on domain and task type, include preferred_step_types in your analysis:
  - LIVE / EXTERNAL DATA (ANY domain) — query needs the current date/time, weather, news, prices, or "latest/now/today" facts the model can't know from memory: ["tool", "llm"]. Lead with "tool"; NEVER return plain ["llm"] for these (it hallucinates stale data).
  - data_engineering: ["mcp", "transform", "evaluation", "llm"]
  - code / software / engineering: ["tool", "llm", "evaluation", "conditional"]
  - research / analysis: ["mcp", "llm", "parallel_sampling"]
  - finance: ["mcp", "transform", "llm", "evaluation"]
  - writing / creative: ["llm", "evaluation", "conditional"]
  - general: ["llm"]

  Include "preferred_step_types" in your JSON output.
FAST_MODE_SYSTEM_PROMPT: |
  You are a CARL chain generator. CARL (Collaborative Agent Reasoning Library) uses structured reasoning chains stored as JSON.

  Given a user query, produce a VALID JSON object representing a CARL chain. Return ONLY the JSON, no explanations.

  JSON format:
  {
    "name": "<short task name>",
    "max_workers": <1-4>,
    "timeout": 300.0,
    "search_config": {
      "strategy": "substring",
      "substring_config": {
        "case_sensitive": false,
        "min_word_length": 3,
        "max_matches_per_query": 5
      }
    },
    "steps": [
      {
        "step_type": "llm",
        "number": <int>,
        "title": "<step title>",
        "aim": "<what the step must establish>",
        "reasoning_questions": "<questions for the LLM>",
        "step_context_queries": ["<keyword 1>", "<keyword 2>"],
        "stage_action": "<action verb + object>",
        "example_reasoning": "<one key reasoning thought>",
        "dependencies": [<previous step numbers>],
        "retry_max": 3,
        "llm_config": null
      }
    ]
  }

  Rules:
  1. Break the task into 3-7 logical steps.
  2. First step(s) have dependencies: [].
  3. Final step depends on all key predecessors.
  4. step_context_queries — 3-6 concrete domain keywords for RAG search. NEVER use generic words like "data", "information", "text", "content".
  5. aim — verb + object, NEVER empty: "Determine X", "Evaluate Y", "Synthesize Z". A non-empty aim is REQUIRED for every step (chain loading fails otherwise).
  6. Dependencies form a DAG (no cycles, no self-references).
  7. step_type values must be one of: "llm", "tool", "mcp", "memory", "transform", "conditional", "structured_output". Use "structured_output" when the next step needs machine-readable JSON. A tool's NAME (e.g. "web_search", "current_datetime") is NEVER a step_type — to call a tool set "step_type": "tool" and put the tool's name in a "tool_name" field. Never put the tool name in step_type.
  8. Return ONLY valid JSON. No prose, no markdown fences, no explanations.

  Example — user query: "Extract key information from a technical document":
  {
    "name": "Technical Document Analysis",
    "max_workers": 2,
    "timeout": 300.0,
    "search_config": {
      "strategy": "substring",
      "substring_config": {"case_sensitive": false, "min_word_length": 3, "max_matches_per_query": 5}
    },
    "steps": [
      {
        "step_type": "llm",
        "number": 1,
        "title": "Identify document type and structure",
        "aim": "Establish document type and its main sections",
        "reasoning_questions": "What type of technical document is this? What is its structure?",
        "step_context_queries": ["document type", "structure", "sections", "introduction"],
        "stage_action": "Classify the document and identify structure",
        "example_reasoning": "The document type determines which information is key",
        "dependencies": [],
        "retry_max": 3,
        "llm_config": null
      },
      {
        "step_type": "llm",
        "number": 2,
        "title": "Extract technical requirements",
        "aim": "Identify all technical requirements and specifications",
        "reasoning_questions": "What specific technical characteristics and requirements are stated?",
        "step_context_queries": ["requirements", "specifications", "parameters", "characteristics"],
        "stage_action": "Systematize technical requirements",
        "example_reasoning": "Technical requirements are the foundation for understanding the document",
        "dependencies": [],
        "retry_max": 3,
        "llm_config": null
      },
      {
        "step_type": "llm",
        "number": 3,
        "title": "Synthesize key findings",
        "aim": "Form a structured summary of key information",
        "reasoning_questions": "What conclusions follow from the document structure and technical requirements?",
        "step_context_queries": ["conclusions", "summary", "results"],
        "stage_action": "Synthesize information into a coherent summary",
        "example_reasoning": "The summary should answer the question of the document's purpose",
        "dependencies": [1, 2],
        "retry_max": 3,
        "llm_config": null
      }
    ]
  }

  Example — TOOL use for LIVE data (the answer needs current info → step 1 calls a tool, NOT the model's memory). Note step_type is the literal "tool"; the tool's name is in "tool_name". User query: "What's the latest single by Imagine Dragons?":
  {
    "name": "Latest Single Lookup",
    "max_workers": 1,
    "timeout": 300.0,
    "search_config": {
      "strategy": "substring",
      "substring_config": {"case_sensitive": false, "min_word_length": 3, "max_matches_per_query": 5}
    },
    "steps": [
      {
        "step_type": "tool",
        "number": 1,
        "title": "Search the web for the latest single",
        "aim": "Fetch current web results about the artist's most recent release",
        "tool_name": "web_search",
        "tool_input_mapping": {"query": "Imagine Dragons latest single"},
        "tool_output_key": "search_results",
        "tool_timeout": 30,
        "dependencies": [],
        "retry_max": 3
      },
      {
        "step_type": "llm",
        "number": 2,
        "title": "Answer from the results",
        "aim": "State the latest single and its release date from the fetched results",
        "reasoning_questions": "Which result is the most recent release? What is its title and date?",
        "step_context_queries": ["latest single", "release date", "new song"],
        "stage_action": "Summarize the freshest matching result",
        "example_reasoning": "Prefer the freshest dated source over any prior assumption",
        "dependencies": [1],
        "retry_max": 3,
        "llm_config": null
      }
    ]
  }

  Example 2 — user query: "Classify customer support tickets by urgency and route to appropriate department" (pipeline pattern):
  {
    "name": "Ticket Classification and Routing",
    "max_workers": 1,
    "timeout": 300.0,
    "search_config": {
      "strategy": "substring",
      "substring_config": {"case_sensitive": false, "min_word_length": 3, "max_matches_per_query": 5}
    },
    "steps": [
      {
        "step_type": "llm",
        "number": 1,
        "title": "Define urgency taxonomy",
        "aim": "Establish urgency levels and their distinguishing criteria",
        "reasoning_questions": "What urgency levels exist? What signals indicate each level?",
        "step_context_queries": ["urgency levels", "priority classification", "SLA tiers"],
        "stage_action": "Define urgency taxonomy with concrete examples",
        "example_reasoning": "Urgency depends on customer impact severity and time-sensitivity",
        "dependencies": [],
        "retry_max": 3,
        "llm_config": null
      },
      {
        "step_type": "llm",
        "number": 2,
        "title": "Extract ticket features",
        "aim": "Identify textual and metadata features that predict urgency",
        "reasoning_questions": "Which keywords, sentiment signals, and metadata fields correlate with urgency?",
        "step_context_queries": ["ticket metadata", "sentiment analysis", "keyword extraction"],
        "stage_action": "Extract classification features from ticket text and metadata",
        "example_reasoning": "Words like 'outage' or 'billing error' strongly signal high urgency",
        "dependencies": [1],
        "retry_max": 3,
        "llm_config": null
      },
      {
        "step_type": "llm",
        "number": 3,
        "title": "Map urgency to department routing rules",
        "aim": "Create routing rules that assign each urgency-department pair",
        "reasoning_questions": "Which departments handle which ticket types? How does urgency affect routing?",
        "step_context_queries": ["department routing", "escalation rules", "support workflow"],
        "stage_action": "Define routing logic from urgency classification to department assignment",
        "example_reasoning": "Critical billing issues route to Finance-Escalation, not general support",
        "dependencies": [2],
        "retry_max": 3,
        "llm_config": null
      }
    ]
  }

  Example 3 — user query: "Plan a product launch strategy for a B2B SaaS tool" (diamond pattern with parallelism):
  {
    "name": "B2B SaaS Product Launch Strategy",
    "max_workers": 3,
    "timeout": 300.0,
    "search_config": {
      "strategy": "substring",
      "substring_config": {"case_sensitive": false, "min_word_length": 3, "max_matches_per_query": 5}
    },
    "steps": [
      {
        "step_type": "llm",
        "number": 1,
