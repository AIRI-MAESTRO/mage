[project]
name = "mmar-mage"
version = "0.1.3"
description = "Mesh Architecture Generation Engine — CARL chain generator from text queries"
authors = [{name = "glazkov", email = "glazkov@airi.net"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["carl", "reasoning", "chain", "llm", "generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    # Required: CARL runtime types back validation (ReasoningChain.from_json),
    # code-gen round-trip (ChainBuilder), skill loading (SkillLoader,
    # AgentSkillSource) and the strict-CARL export path.
    "mmar-carl>=0.2",
]

[project.scripts]
mage = "mmar_mage.cli:app"

[project.urls]
Homepage = "https://github.com/Glazkoff/carl-mage"
Repository = "https://github.com/Glazkoff/carl-mage"
Issues = "https://github.com/Glazkoff/carl-mage/issues"

[project.optional-dependencies]
# Memory is optional (MAGE runs without it). gigaevo-client is the renamed SDK
# (was gigaevo-memory); MemoryManager prefers `gigaevo_client`, falling back to
# the legacy `gigaevo_memory` shim if only that is present. mmar-carl is no
# longer an extra — it is a required runtime dependency (see [dependencies]).
memory = [
    "gigaevo-client>=0.3.0",
]
all = [
    "mmar-mage[memory]",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmar_mage"]

# No [tool.uv.sources]: the whole MMAR stack is PyPI-first now (mmar-carl 0.3.0,
# gigaevo-client 0.3.0 published; care dropped its local pins the same day). The
# client moved out of the gigaevo-memory monorepo into the standalone
# ../gigaevo-client repo, so the old path pin is gone for good. For cross-repo dev
# against an unpublished sibling, add a temporary local override:
#   uv add --editable ../carl-experiments  (or ../gigaevo-client)

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
